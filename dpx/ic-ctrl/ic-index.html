<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IC-CTRL</title>
  <link rel="preload" href="LGM-30A.mp3" as="audio">
  <link rel="stylesheet" href="ic-styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" href="../../favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../../favicon/favicon.svg" />
  <link rel="shortcut icon" href="../../favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Digipathoxina" />
  <link rel="manifest" href="../../favicon/site.webmanifest" />
    
  <link rel="stylesheet" href="ic-styles.css">
  <link rel="stylesheet" href="ic-styles-h.css">
  <link rel="stylesheet" href="ic-mobile.css" media="(max-width: 768px)">
</head>

<body>
  <audio id="intro-audio" src="LGM-30A.mp3"></audio>

  <!-- Titoli (clickabili se l'autoplay è bloccato) -->
  <div id="titles" class="hidden" role="button" aria-label="Avvia riproduzione">
    <h1 id="title-big">
      <span class="lgm">LGM</span>-<span class="thirty">30A</span>
    </h1>
    <h2 id="title-small">ISMAELE SORAPERRA</h2>
  </div>

  <!-- Avviso se i popup vengono bloccati -->
  <div id="popupNotice" class="notice hidden">
    Pop‑up bloccati: clicca sulla scritta per aprire le 11 GIF.
  </div>

  <!-- LANG SWITCH -->
<div id="lang-switch" class="">
  <button class="lang active" data-lang="eng" aria-pressed="true">🇬🇧</button>
  <button class="lang" data-lang="ita" aria-pressed="false">🇮🇹</button>
</div>

  <script>
    (function () {
      var isMobile = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;

      if (isMobile) {
        document.documentElement.classList.add('ic-mobile-mode');
        document.write('<script src="ic-mobile.js"><\/script>');
      } else {
        document.documentElement.classList.add('ic-desktop-mode');
        // Desktop originale: NON caricare intro.js, perché la pre-intro Hello Kitty è già dentro ic-script.js.
        document.write('<script src="ic-script.js"><\/script>');
        document.write('<script src="ic-script-h.js"><\/script>');
      }
    })();
  </script>
</body>

</html>
