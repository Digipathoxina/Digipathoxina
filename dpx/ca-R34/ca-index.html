<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CA-R34</title>
  <link rel="icon" type="image/png" href="../../../favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../../favicon/favicon.svg" />
  <link rel="shortcut icon" href="../../../favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../../favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Digipathoxina" />
  <link rel="manifest" href="../../../favicon/site.webmanifest" />
  <link rel="stylesheet" href="ca-styles.css" />
</head>

<body>

  <!-- BLOCCHI IMMAGINI -->
  <img src="gif/blocco-1.gif" class="gruppo g0" alt="" />
  <img src="gif/blocco-2.gif" class="gruppo g1" alt="" />
  <img src="gif/blocco-3.gif" class="gruppo g2" alt="" />
  <img src="gif/blocco-4.gif" class="gruppo g3" alt="" />

  <!-- GIF CENTRALE -->
  <img src="donnina.gif" id="donnina" alt="" />

  <!-- IMMAGINI MOBILI -->
  <div id="abo-container"></div>

  <!-- CERCHI -->
  <div class="cerchio-container left">
    <img src="tasti/bottone.png" class="cerchio-btn" alt="" />
    <img src="tasti/cerchio.png" class="cerchio" id="cerchio-1" alt="" />
  </div>

  <div class="cerchio-container right">
    <img src="tasti/bottone.png" class="cerchio-btn" alt="" />
    <img src="tasti/cerchio.png" class="cerchio" id="cerchio-2" alt="" />
  </div>

  <!-- SLIDER -->
  <div id="sliders">
    <div class="slider" id="slider-1"></div>
    <div class="slider" id="slider-2"></div>
    <div class="slider" id="slider-3"></div>
    <div class="slider" id="slider-4"></div>

    <!-- SLIDER ORIZZONTALI (ruotate 90°) -->
    <div class="slider horizontal" id="slider-5"></div>
    <div class="slider horizontal" id="slider-6"></div>
  </div>

  <!-- BOTTONE ROSSO -->
  <button id="nav-btn" aria-label="next"></button>

  <!-- FONTANA LINK -->
  <div id="fountain"></div>

  <script src="ca-script.js"></script>
</body>

</html>
