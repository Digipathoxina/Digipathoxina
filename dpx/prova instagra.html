<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram Overlay</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* BACKGROUND */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url("sfono.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.02); /* leggero “riempimento” */
    }

    /* Un velo leggero per leggibilità (facoltativo) */
    .veil {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.18);
      pointer-events: none;
    }

    /* DOT (il “punto” cliccabile) - lo metto dove vuoi tu */
    .dot {
      position: fixed;
      right: 28px;
      bottom: 28px;

      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 0 7px rgba(255,255,255,.16);
      z-index: 10;
    }

    /* MODAL: piccolo, rettangolare orizzontale, in basso a destra */
    .modal {
      position: fixed;
      right: 24px;
      bottom: 76px; /* un po’ più su del margine inferiore */
      width: 350px;
      max-width: calc(100vw - 48px);
      height: 500px;

      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 8px;

      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      overflow: hidden;

      display: none; /* si apre al click */
      z-index: 20;
    }

    .modalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255,255,255,0.65);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .modalHeader strong {
      font-size: 14px;
      letter-spacing: .2px;
    }

    .close {
      border: 0;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 10px;
    }
    .close:hover { background: rgba(0,0,0,0.06); }

    .modalBody {
      height: calc(100% - 44px);
      padding: 8px 10px 10px;
      overflow: hidden; /* mantiene il riquadro “pulito” */
    }

    /* L'embed Instagram tende a voler essere largo: lo “contengo” */
    .igWrap {
      height: 100%;
      width: 100%;
      overflow: auto;
      border-radius: 12px;
      background: #fff;
    }

    /* Backdrop cliccabile (per chiudere cliccando fuori) */
    .backdrop {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 15;
      background: rgba(0,0,0,0.0); /* invisibile, serve solo al click fuori */
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="veil"></div>

  <!-- punto cliccabile -->
  <div class="dot" id="open" title="Apri Instagram"></div>

  <!-- backdrop per chiudere cliccando fuori -->
  <div class="backdrop" id="backdrop"></div>

  <!-- riquadro in basso a destra -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Instagram">
    <div class="modalHeader">
      <strong>Instagram</strong>
      <button class="close" id="close" aria-label="Chiudi">×</button>
    </div>

    <div class="modalBody">
      <div class="igWrap">
        <blockquote class="instagram-media"
          data-instgrm-permalink="https://www.instagram.com/_spacehack_/"
          data-instgrm-version="14"
          style="width:100%; margin:0;">
        </blockquote>
      </div>
    </div>
  </div>

  <!-- script Instagram per renderizzare l'embed -->
  <script async src="https://www.instagram.com/embed.js"></script>

  <script>
    const openBtn = document.getElementById('open');
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('close');
    const backdrop = document.getElementById('backdrop');

    function openModal() {
      modal.style.display = 'block';
      backdrop.style.display = 'block';
      if (window.instgrm?.Embeds?.process) window.instgrm.Embeds.process();
    }

    function closeModal() {
      modal.style.display = 'none';
      backdrop.style.display = 'none';
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  </script>
</body>
</html>
