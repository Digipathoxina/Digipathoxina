<!DOCTYPE html>
<html lang="en" data-lang="en">

<head>
  <meta charset="utf-8" />
  <title>PurrNet Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="../../favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../../favicon/favicon.svg" />
  <link rel="shortcut icon" href="../../favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Digipathoxina" />
  <link rel="manifest" href="../../favicon/site.webmanifest" />
  <link rel="stylesheet" href="ec-styles.css" />
  <!-- CSS MOBILE SEPARATO -->
  <link rel="stylesheet" href="ec-mobile.css" media="(max-width: 900px)" />
</head>

<body>
  <!-- HEADER -->
  <header class="top">
    <div class="wrap top-inner header-flex header-with-tabs">
      <a class="brand" href="#" data-route="home" title="PurrNet">
        <span class="cat">=^..^=</span> <span class="logo">PurrNet</span>
      </a>

      <!-- TABS AL CENTRO -->
      <nav class="tabs-wrap" id="topTabs" aria-label="Primary">
        <a href="#" class="tab active" data-route="home">Home</a>
        <a href="#" class="tab" data-route="about">About</a>
        <a href="#" class="tab" data-route="archive">Archive</a>
      </nav>

      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="on">EN</button>
        <button type="button" data-lang="it">IT</button>
      </div>
    </div>
  </header>

  <!-- LOGOUT -->
  <a href="#" class="exit-btn" data-next>➜]</a>

  <!-- HERO (solo Home) -->
  <div class="wrap home-hero" id="homeHero">
    <img src="media/homepage.png" alt="Homepage illustration">
  </div>

  <!-- LAYOUT -->
  <div class="wrap layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- LOGIN -->
      <section class="card glass login-card">
        <form class="login" id="loginForm">
          <label data-i18n="userLabel">
            User<br><input id="loginUser" type="text" placeholder="admin">
          </label>

          <label data-i18n="passLabel">
            Password<br><input id="loginPass" type="password" placeholder="••••••">
          </label>

          <div class="login-actions">
            <label class="remember-wrap">
              <input id="rememberAdmin" type="checkbox">
              <span>Remember me</span>
            </label>

            <button type="submit" class="btn" data-i18n="signinBtn">Login</button>
          </div>
        </form>
      </section>

      <!-- WIDGET (ora subito sotto login, e sopra Messaggi) -->
      <section class="placeholder">
        <h2 data-i18n="widgetTitle">Widget</h2>
        <p>
          <a href="#" id="convFissata" data-i18n="pinnedTitle">Conversazione fissata</a><br>
          <a href="dd-pill/dd-pill-index.html" data-i18n="externalLinks">Altri link utili</a>
        </p>
      </section>

      <!-- MESSAGGI (senza titolo) -->
      <section class="messages">
        <div class="msg-list" id="msgList"></div>
      </section>

      <!-- BANNER (senza titolo) -->
      <section class="banner">
        <img class="pray" src="media/pray.png" alt="Pray">
        <a class="big-btn pray-link" href="#" data-next data-i18n="prayCta">Join the prayer</a>
        <p class="muted" data-i18n="bannerNote">Help and support our community</p>
      </section>

      <!-- AD random -->
      <section class="ad-slot" aria-label="Ad">
        <div id="spamZone"></div>
      </section>

      <!-- TAGS (lascio titolo: non mi hai chiesto di toglierlo) -->
      <section>
        <h2 data-i18n="tagsTitle">Tags</h2>
        <div class="tags" id="tagCloud"></div>
      </section>

    </aside>

    <!-- MAIN -->
    <main id="main">
      <section id="feed" class="feed"></section>
      <div class="more-wrap">
        <a href="#" class="more-link" data-next data-i18n="morePosts">More posts</a>
      </div>
      <div id="archiveMore" class="more-wrap">
        <a href="#" class="more-link" data-next data-i18n="morePosts">More posts</a>
      </div>
    </main>
  </div>

  <footer class="foot">
    © 2018–2025 PurrNet. All rights reserved.
  </footer>

  <div id="hackOverlay" aria-hidden="true"> &lt;HACK&gt; </div>

  <!-- Modal Admin -->
  <div id="adminModal" aria-hidden="true">
    <div class="modal-card">
      <h3 class="modal-title">Profile</h3>
      <div class="profile">
        <img class="avatar" src="media/admin.png" alt="Admin avatar">
        <ul class="modal-list">
          <li><strong>Name:</strong> ModGirl_97</li>
          <li><strong>Email:</strong> modgirl97@purrnet.com</li>
          <li><strong>State:</strong> Admin</li>
        </ul>
      </div>
      <button id="logoutBtn" class="btn modal-logout">Logout</button>
    </div>
  </div>

  <script src="ec-content-it.js"></script>
  <script src="ec-content-en.js"></script>
  <script src="ec-script.js" defer></script>
  <script src="ec-mobile.js" defer></script>
</body>

</html>
