<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DD-404</title>

  <!-- Font: Jacquarda Bastarda 9 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root {
      --ui: rgba(255, 255, 255, 0.95);
      --bg: #000;
      --white: #fff;
      --glow: rgba(255, 255, 255, 0.65);
      --border: rgba(255, 255, 255, 0.35);

      /* safe area helpers */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overscroll-behavior: none;
      /* iOS/Android: evita rimbalzo/scroll strani */
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ui);
      font-family: "DotGothic16", sans-serif;
      font-weight: 400;
      font-style: normal;
      /* mobile: rendi tap più pulito */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* usa svh per iPhone (address bar) */
    model-viewer {
      width: 100%;
      height: 100svh;
      background-image: url("dd3.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      touch-action: none;
    }

    /* ===== PHASE GLITCH ===== */
    .phase-glitch {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      mix-blend-mode: lighten;
      animation: phaseShift 9s infinite ease-in-out;
    }

    .phase-glitch::before,
    .phase-glitch::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.03);
    }

    .phase-glitch::before {
      filter: blur(0.6px);
      opacity: 0.35;
      animation: phaseDrift 6s infinite ease-in-out;
    }

    .phase-glitch::after {
      filter: blur(1.2px);
      opacity: 0.25;
      animation: phaseDriftAlt 11s infinite ease-in-out;
    }

    @keyframes phaseShift {

      0%,
      100% {
        transform: scale(1) translate(0, 0);
      }

      50% {
        transform: scale(1.01) translate(1px, -1px);
      }
    }

    @keyframes phaseDrift {

      0%,
      100% {
        transform: translate(0, 0);
      }

      40% {
        transform: translate(2px, 0);
      }

      70% {
        transform: translate(-1px, 1px);
      }
    }

    @keyframes phaseDriftAlt {

      0%,
      100% {
        transform: translate(0, 0);
      }

      30% {
        transform: translate(-2px, 1px);
      }

      65% {
        transform: translate(1px, -2px);
      }
    }

    /* ===== LOADER ===== */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      padding: 24px 18px calc(44px + var(--safe-bottom));
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      transition: opacity 420ms ease;
    }

    .loader.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader__hint {
      font-size: 15px;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 52ch;
      color: var(--white);
      font-style: italic;
      opacity: 0;
      transform: translateY(10px);
      text-shadow:
        0 0 14px var(--glow),
        0 0 40px rgba(255, 255, 255, 0.35);
      transition: opacity 520ms ease, transform 520ms ease;
    }

    .loader__hint.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .loader__hint.blink {
      animation: slowBlink 3.2s ease-in-out infinite;
    }

    @keyframes slowBlink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.38;
      }
    }

    .loader__bar {
      position: relative;
      width: min(320px, 72vw);
      height: 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      overflow: hidden;
      box-shadow:
        0 0 8px rgba(255, 255, 255, 0.18),
        inset 0 0 5px rgba(255, 255, 255, 0.18);
    }

    .loader__fill {
      height: 100%;
      width: 0%;
      position: relative;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 1));
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.85),
        0 0 24px rgba(255, 255, 255, 0.45);
      transition: width 160ms linear;
    }

    .loader__bar::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      mix-blend-mode: overlay;
      background-image:
        repeating-radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.35) 0 1px, rgba(0, 0, 0, 0) 1px 3px),
        repeating-radial-gradient(circle at 70% 60%, rgba(0, 0, 0, 0.55) 0 1px, rgba(0, 0, 0, 0) 1px 4px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.08) 0 1px, rgba(0, 0, 0, 0) 1px 3px);
      background-size: 120px 90px, 160px 120px, 6px 6px;
      animation: noiseDrift 0.9s steps(2, end) infinite;
      filter: contrast(1.4);
    }

    @keyframes noiseDrift {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(2px, -1px);
      }

      50% {
        transform: translate(-2px, 1px);
      }

      75% {
        transform: translate(1px, 2px);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    .loader__fill::after {
      content: "";
      position: absolute;
      inset: -6px;
      pointer-events: none;
      opacity: 0.18;
      mix-blend-mode: soft-light;
      background-image:
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0 1px, rgba(0, 0, 0, 0) 1px 6px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.10) 0 1px, rgba(255, 255, 255, 0) 1px 5px);
      animation: fillNoise 1.1s steps(2, end) infinite;
    }

    @keyframes fillNoise {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-6px);
      }

      100% {
        transform: translateX(0);
      }
    }

    /* ===== PLAY BUTTON (bigger for mobile) ===== */
    .play-btn {
      position: fixed;
      top: calc(14px + var(--safe-top));
      right: calc(14px + var(--safe-right));
      z-index: 60;

      width: 45px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.15);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      user-select: none;

      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.35),
        0 0 24px rgba(255, 255, 255, 0.25),
        inset 0 0 8px rgba(255, 255, 255, 0.25);

      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .play-btn.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .play-icon {
      font-size: 17px;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
      line-height: 1;
      font-family: "DotGothic16", sans-serif;
      transform: translateY(-2px);
    }

    /* ===== NOW PLAYING ===== */
    .now-playing {
      position: fixed;
      top: calc(26px + var(--safe-top));
      right: calc(14px + var(--safe-right));
      z-index: 60;

      display: flex;
      align-items: center;
      gap: 5px;

      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;

      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .now-playing.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .now-playing input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #fff;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.45));
      transform: translateY(3px);
    }

    .now-playing label {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.2px;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
      max-width: 58vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== hidden animation mixer container (kept invisible) ===== */
    .anim-mixer {
      position: fixed;
      top: 0;
      right: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0 !important;
      pointer-events: none !important;
      user-select: none !important;
    }
  </style>
</head>

<body>

  <model-viewer id="viewer" src="room-brainrot.glb" camera-controls interaction-prompt="none"
    camera-orbit="10deg 82deg 13m" camera-target="0m 1m 0m" min-camera-orbit="auto auto 0.1m"
    max-camera-orbit="auto auto 100m" field-of-view="65deg" environment-image="moon.hdr" exposure="0.6"
    shadow-intensity="0.3" autoplay>
  </model-viewer>

  <div class="phase-glitch" aria-hidden="true"></div>

  <div id="loader" class="loader">
    <div id="hint" class="loader__hint blink">Headphones recommended</div>
    <div class="loader__bar">
      <div id="barFill" class="loader__fill"></div>
    </div>
  </div>

  <!-- Play button for audio (and to start autorotate too) -->
  <button id="playBtn" class="play-btn" type="button" aria-label="Play audio">
    <span class="play-icon">⏯</span>
  </button>

  <div id="nowPlaying" class="now-playing" aria-live="polite">
    <input id="npCheck" type="checkbox" checked />
    <label for="npCheck">binaural-sound.mp3</label>
  </div>

  <!-- hidden mixer UI (kept for “play all” mixing logic) -->
  <div id="animMixer" class="anim-mixer" aria-hidden="true"></div>

  <audio id="bgAudio" src="binaural-sound.mp3" preload="auto" loop></audio>

  <script>
    const viewer = document.querySelector('#viewer');
    const loader = document.querySelector('#loader');
    const hint = document.querySelector('#hint');
    const barFill = document.querySelector('#barFill');

    const playBtn = document.querySelector('#playBtn');
    const nowPlaying = document.querySelector('#nowPlaying');
    const npCheck = document.querySelector('#npCheck');

    const audio = document.querySelector('#bgAudio');

    // ====== AUTOROTATE: lento + irregolare ======
    const IDLE_BEFORE_RESUME_MS = 1400;
    const SPEED_MIN_DEG = 0;
    const SPEED_MAX_DEG = 1;

    let idleTimer = null;
    let jitterTimer = null;

    function setRotationSpeedRandom() {
      const speed = SPEED_MIN_DEG + Math.random() * (SPEED_MAX_DEG - SPEED_MIN_DEG);
      viewer.setAttribute('rotation-per-second', speed.toFixed(2) + 'deg');
    }

    function startJitter() {
      stopJitter();
      const loop = () => {
        if (!viewer.autoRotate) return;
        setRotationSpeedRandom();
        const next = 700 + Math.random() * 1100;
        jitterTimer = setTimeout(loop, next);
      };
      loop();
    }

    function stopJitter() {
      if (jitterTimer) clearTimeout(jitterTimer);
      jitterTimer = null;
    }

    function pauseAutoRotateAndScheduleResume() {
      // se non è mai stato “attivato”, non fare niente
      if (!userActivated) return;

      viewer.autoRotate = false;
      stopJitter();

      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        viewer.autoRotate = true;
        startJitter();
      }, IDLE_BEFORE_RESUME_MS);
    }

    // ====== ANIMATION "PLAY ALL" DEFAULT (mixer) ======
    const appended = new Map();

    function appendAllAnimationsOnce() {
      const anims = viewer.availableAnimations || [];
      if (!anims.length) return;

      if (typeof viewer.appendAnimation === 'function') {
        for (const name of anims) {
          if (appended.has(name)) continue;
          try {
            const handle = viewer.appendAnimation(name, { weight: 1 });
            appended.set(name, handle ?? null);
          } catch (e) {
            appended.set(name, null);
          }
        }
        try { viewer.play(); } catch (e) { }
        return;
      }

      // fallback
      try {
        viewer.animationName = anims[0];
        viewer.play();
      } catch (e) { }
    }

    // ====== AUDIO + START EXPERIENCE (audio + autorotate) ======
    let audioStarted = false;
    let userActivated = false;

    function startAutoRotateNow() {
      viewer.autoRotate = true;
      setRotationSpeedRandom();
      startJitter();
    }

    async function startExperienceFromGesture() {
      // 1) mark as activated
      if (!userActivated) {
        userActivated = true;
        startAutoRotateNow();
      }

      // 2) start audio
      if (audioStarted) return true;

      try {
        await audio.play();
        audioStarted = true;

        // swap UI
        playBtn.classList.remove('is-visible');
        playBtn.style.pointerEvents = 'none';
        nowPlaying.classList.add('is-visible');
        return true;
      } catch (e) {
        // audio blocked -> keep play button visible
        return false;
      }
    }

    // checkbox off => exit
    npCheck.addEventListener('change', () => {
      if (!npCheck.checked) {
        window.location.href = 'ca-pill/ca-pill-index.html';
      }
    });

    // clicks that should start experience
    playBtn.addEventListener('click', startExperienceFromGesture);

    function onUserInteractsWithModel() {
      // interaction triggers experience and pauses/resumes autorotate behavior
      startExperienceFromGesture();
      pauseAutoRotateAndScheduleResume();
    }
    viewer.addEventListener('pointerdown', onUserInteractsWithModel);
    viewer.addEventListener('camera-change', onUserInteractsWithModel);

    // ===== Loader / progress =====
    window.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => hint.classList.add('is-visible'));
    });

    viewer.addEventListener('progress', (e) => {
      const p = Math.max(0, Math.min(1, e.detail.totalProgress || 0));
      barFill.style.width = Math.round(p * 100) + '%';
    });

    viewer.addEventListener('load', () => {
      // animations all-on
      appendAllAnimationsOnce();

      // IMPORTANT: autorotate must NOT start here anymore
      viewer.autoRotate = false;

      // hide loader
      hint.classList.remove('is-visible');
      loader.classList.add('is-hidden');
      setTimeout(() => loader.remove(), 420);

      // show play button (now needed to start experience)
      playBtn.classList.add('is-visible');
    });
  </script>

</body>

</html>
